<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Whiteman</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="global-header">
    <div class="lang-switcher">
      <button class="lang-btn active" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="uz">UZ</button>
      <button class="lang-btn" data-lang="ru">RU</button>
    </div>
  </header>

  <main id="app">
    <section id="screen-welcome" class="screen active">
  <div class="welcome-logo">🎭</div>
  <h1 class="welcome-title" data-i18n="gameTitle">WHITEMAN</h1>
  <p class="welcome-subtitle" data-i18n="gameSubtitle">Find the imposter!</p>
  <div class="flex-col gap-12 w-full mt-24">
    <button class="btn btn-primary" id="btn-new-game" data-i18n="newGame">New Game</button>
    <button class="btn btn-secondary" id="btn-leaderboard" data-i18n="leaderboard">Leaderboard</button>
  </div>
</section>
    <section id="screen-setup" class="screen">
  <h2 data-i18n="howManyPlayers">How many players?</h2>
  <div class="player-count-picker mt-16">
    <button class="count-btn" id="btn-count-minus">&minus;</button>
    <span class="count-display" id="player-count">4</span>
    <button class="count-btn count-btn-plus" id="btn-count-plus">+</button>
  </div>
  <div id="player-inputs" class="player-inputs mt-16"></div>
  <div id="recent-players-section" class="recent-section mt-16" style="display:none;">
    <div class="recent-header">
      <span class="recent-label" data-i18n="recentPlayers">Recent Players</span>
      <button class="btn-text-small" id="btn-clear-recent" data-i18n="clearRecent">Clear</button>
    </div>
    <div id="recent-players-list" class="recent-chips"></div>
  </div>
  <button class="btn btn-primary w-full mt-24" id="btn-start-game" data-i18n="startGame" disabled>Start Game</button>
</section>
    <section id="screen-deal" class="screen">
  <p class="deal-instruction" data-i18n="passPhoneTo">Pass the phone to</p>
  <h2 class="deal-player-name" id="deal-player-name"></h2>
  <div class="deal-card" id="deal-card">
    <div class="deal-card-front" id="deal-card-front">
      <span data-i18n="tapToReveal">Tap to reveal</span>
    </div>
    <div class="deal-card-back" id="deal-card-back" style="display:none;">
      <p class="deal-word-label" data-i18n="yourWord">Your word:</p>
      <p class="deal-word" id="deal-word"></p>
      <p class="deal-hint" data-i18n="tapToHide">Tap to hide</p>
    </div>
  </div>
  <button class="btn btn-success w-full mt-24" id="btn-got-it" data-i18n="gotIt" disabled>Got it!</button>
</section>
    <section id="screen-discuss" class="screen">
  <div class="discuss-icon">💬</div>
  <h2 data-i18n="timeToDiscuss">Time to Discuss!</h2>
  <p class="discuss-instruction" data-i18n="discussInstruction">Each player says ONE word that describes their word.</p>
  <div id="discuss-players" class="discuss-chips mt-16"></div>
  <button class="btn btn-primary w-full mt-24" id="btn-done-discuss" data-i18n="doneTalking">Done Discussing</button>
</section>
    <section id="screen-vote" class="screen">
  <h2 data-i18n="whoIsWhiteman">Who is the Whiteman?</h2>
  <div id="vote-grid" class="vote-grid mt-16"></div>
  <button class="btn btn-danger w-full mt-24" id="btn-eliminate" data-i18n="eliminate" disabled>Eliminate!</button>
</section>
    <section id="screen-result" class="screen">
  <div class="result-emoji" id="result-emoji"></div>
  <h2 class="result-title" id="result-title"></h2>
  <p class="result-subtitle" id="result-subtitle"></p>
  <div class="flex-col gap-12 w-full mt-24">
    <button class="btn btn-primary" id="btn-next-round" style="display:none;">Next Round</button>
    <button class="btn btn-secondary" id="btn-to-gameover" style="display:none;">Game Over</button>
  </div>
</section>
    <section id="screen-gameover" class="screen">
  <div class="gameover-emoji" id="gameover-emoji"></div>
  <h2 class="gameover-title" id="gameover-title"></h2>
  <p class="gameover-subtitle" id="gameover-subtitle"></p>
  <div class="score-table mt-16" id="gameover-scores"></div>
  <div class="flex-col gap-12 w-full mt-24">
    <button class="btn btn-primary" id="btn-play-again" data-i18n="playAgain">Play Again</button>
    <button class="btn btn-secondary" id="btn-new-game-go" data-i18n="newGameBtn">New Game</button>
    <button class="btn btn-secondary" id="btn-main-menu" data-i18n="mainMenu">Main Menu</button>
  </div>
</section>
    <section id="screen-leaderboard" class="screen">
  <h2 data-i18n="leaderboardTitle">Leaderboard</h2>
  <div class="leaderboard-list mt-16" id="leaderboard-list"></div>
  <div class="flex-col gap-12 w-full mt-24">
    <button class="btn btn-secondary" id="btn-clear-leaderboard" data-i18n="clearLeaderboard">Clear Leaderboard</button>
    <button class="btn btn-primary" id="btn-lb-back" data-i18n="back">Back</button>
  </div>
</section>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/game.js"></script>
  <script src="assets/confetti.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
