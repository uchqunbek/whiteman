<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Whiteman</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="global-header">
    <div class="lang-switcher">
      <button class="lang-btn active" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="uz">UZ</button>
      <button class="lang-btn" data-lang="ru">RU</button>
    </div>
  </header>

  <main id="app">
    <section id="screen-welcome" class="screen active">
      <h1>Welcome (placeholder)</h1>
    </section>
    <section id="screen-setup" class="screen">
      <h1>Setup (placeholder)</h1>
    </section>
    <section id="screen-deal" class="screen">
      <h1>Deal (placeholder)</h1>
    </section>
    <section id="screen-discuss" class="screen">
      <h1>Discuss (placeholder)</h1>
    </section>
    <section id="screen-vote" class="screen">
      <h1>Vote (placeholder)</h1>
    </section>
    <section id="screen-result" class="screen">
      <h1>Result (placeholder)</h1>
    </section>
    <section id="screen-gameover" class="screen">
      <h1>Game Over (placeholder)</h1>
    </section>
    <section id="screen-leaderboard" class="screen">
      <h1>Leaderboard (placeholder)</h1>
    </section>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/game.js"></script>
  <script src="assets/confetti.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
